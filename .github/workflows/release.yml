# Push a tag like v1.1.0 to publish a GitHub release with the plugin zip and
# release.json. The license server (GitHub source) serves the latest release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches plugin version
        run: |
          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' product-sync-feeds/product-sync-feeds.php | head -1 | tr -d '\r ')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match plugin version $version" >&2
            exit 1
          fi

      - name: Build zip
        run: bin/build-zip.sh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/product-sync-feeds.zip dist/release.json \
            --title "$GITHUB_REF_NAME" --notes-file dist/CHANGELOG.md
