# Full test stack: everything in ../docker-compose.yml plus FTP and SFTP
# servers to upload feeds to. See README.md.
name: psftest

include:
  - ../docker-compose.yml

services:
  sftp:
    image: atmoz/sftp:alpine
    command: feeder:secret:1001::upload
  ftp:
    image: delfer/alpine-ftp-server
    environment:
      USERS: "feeder|secret|/home/feeder"
      ADDRESS: ftp
