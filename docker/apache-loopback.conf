# The site URL uses the host port (e.g. http://localhost:8089), and WordPress
# calls itself at that URL to run WP-Cron and Action Scheduler. Inside the
# container Apache listens on 80, so without this those calls fail and visits
# never trigger scheduled runs. Answer on the host port too, like a real host.
Listen ${PSF_LOOPBACK_PORT}
<VirtualHost *:${PSF_LOOPBACK_PORT}>
	DocumentRoot /var/www/html
</VirtualHost>
