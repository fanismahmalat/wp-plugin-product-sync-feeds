# Local test stack: WordPress + WooCommerce with the plugin (product-sync-feeds/)
# mounted from the repo, WP-CLI and a cron runner.
#
#   docker compose up -d
#
# First-time setup and logins: docker/README.md.
name: psftest

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wp
  WORDPRESS_DB_NAME: wp

x-wp-volumes: &wp-volumes
  - wpdata:/var/www/html
  - ./product-sync-feeds:/var/www/html/wp-content/plugins/product-sync-feeds
  - ./tests:/var/www/psf-tests:ro

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wp
      MYSQL_USER: wp
      MYSQL_PASSWORD: wp
    volumes:
      # Named, so the database survives removing or recreating the container.
      - dbdata:/var/lib/mysql

  wp:
    image: wordpress:php8.2-apache
    depends_on: [db]
    ports: ["8089:80"]
    environment:
      <<: *wp-env
      PSF_LOOPBACK_PORT: "8089"
    volumes:
      - wpdata:/var/www/html
      - ./product-sync-feeds:/var/www/html/wp-content/plugins/product-sync-feeds
      - ./tests:/var/www/psf-tests:ro
      # Lets WordPress reach itself at http://localhost:8089, so site visits run WP-Cron.
      - ./docker/apache-loopback.conf:/etc/apache2/conf-enabled/psf-loopback.conf:ro

  cli:
    image: wordpress:cli-php8.2
    depends_on: [db, wp]
    user: "33:33"
    environment: *wp-env
    volumes: *wp-volumes
    entrypoint: ["sleep", "infinity"]

  # Plays the role of the server cron job: runs due scheduled tasks every 30
  # seconds, so schedules stay on time even when nobody visits the site.
  cron:
    image: wordpress:cli-php8.2
    depends_on: [db, wp]
    user: "33:33"
    environment: *wp-env
    volumes: *wp-volumes
    entrypoint: ["sh", "-c", "while true; do wp action-scheduler run --hooks=psf_scheduled_full,psf_scheduled_delta,psf_process_batch,psf_maintenance --quiet; sleep 30; done"]

volumes:
  wpdata:
  dbdata:
